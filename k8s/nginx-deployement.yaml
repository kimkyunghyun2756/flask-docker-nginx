apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx-container
          image: ghcr.io/kimkyunghyun2756/nginx:latest  # 🔁 빌드한 Nginx 이미지 태그
          ports:
            - containerPort: 80
