name: Deploy Flask App

on:
  push:
    branches:
      - gctest

jobs:
  flask-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

      - name: Build and Push Flask Image
        run: |
          docker build -t ghcr.io/${{ secrets.GHCR_USERNAME }}/flask-app:latest ./flask-docker
          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/flask-app:latest

      - name : Create kubeconfig file
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig

      - name: Deploy to Kubernetes
        run: |
          kubectl --kubeconfig=k8s/kubeconfig apply -f k8s/flask-deployment.yaml
          kubectl --kubeconfig=k8s/kubeconfig apply -f k8s/flask-service.yaml

